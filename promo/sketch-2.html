<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>方向B · 物件即页面（闪卡）</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/700.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/900.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5/600.css" rel="stylesheet" />
<style>
:root{
  --c-primary:#0064E0; --c-primary-deep:#0457CB; --c-primary-bg:#EAF2FE;
  --c-ink-deep:#0A1317; --c-ink:#1C1E21; --c-charcoal:#444950; --c-steel:#5D6C7B; --c-stone:#8595A4;
  --c-page:#F5F7FA; --c-canvas:#FFFFFF; --c-surface-soft:#F1F4F7; --c-hairline-soft:#DEE3E9;
  --c-success:#31A24C; --c-success-bg:#E9F6EC; --c-warning:#F7B928; --c-warning-bg:#FFF7E4;
  --r-lg:24px; --r-md:16px; --r-sm:12px; --r-pill:999px;
  --font-sans:"Noto Sans SC",-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-term:"Inter",var(--font-sans);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--c-page);color:var(--c-ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:460px;margin:0 auto;padding:0 20px 64px;min-height:100vh}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{font-weight:900;font-size:17px}.brand b{color:var(--c-primary)}
.topbar .tag{font-size:12px;color:var(--c-steel);background:var(--c-surface-soft);padding:5px 12px;border-radius:var(--r-pill)}
.hero{padding:22px 0 8px;text-align:center}
.eyebrow{font-size:13px;color:var(--c-steel);letter-spacing:.16em;text-transform:uppercase;margin-bottom:14px}
/* 闪卡物件 */
.card{position:relative;margin:0 auto;width:100%;max-width:340px;height:420px;perspective:1600px;cursor:pointer}
.inner{position:absolute;inset:0;transition:transform .7s cubic-bezier(.2,0,.2,1);transform-style:preserve-3d}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--r-lg);border:1px solid var(--c-hairline-soft);box-shadow:0 16px 48px rgba(16,24,40,.16);padding:30px;display:flex;flex-direction:column}
.front{background:var(--c-canvas);align-items:center;justify-content:center;text-align:center}
.back{background:linear-gradient(180deg,var(--c-primary-bg),var(--c-canvas) 65%);transform:rotateY(180deg);align-items:flex-start;justify-content:center;text-align:left}
.pos{font-size:12px;font-weight:700;color:var(--c-primary);letter-spacing:.08em}
.term{font-family:var(--font-term);font-weight:600;font-size:46px;line-height:1.05;color:var(--c-ink-deep);margin:10px 0 6px}
.ph{font-family:var(--font-term);font-size:18px;color:var(--c-steel);font-weight:600}
.hint{margin-top:auto;font-size:12px;color:var(--c-stone)}
.def{font-size:20px;font-weight:700;line-height:1.5;color:var(--c-ink-deep)}
.ex{margin-top:14px;font-size:14px;line-height:1.7;color:var(--c-charcoal);background:var(--c-canvas);border:1px solid var(--c-hairline-soft);border-radius:var(--r-md);padding:14px}
.ex b{color:var(--c-primary-deep);font-weight:700}
.flipbtn{font-size:13px;color:var(--c-steel);margin-top:10px;background:none;border:none}
.headline{font-size:28px;font-weight:900;line-height:1.3;color:var(--c-ink-deep);margin:26px 0 12px;text-align:center}
.sub{font-size:15px;line-height:1.7;color:var(--c-charcoal);text-align:center;max-width:380px;margin:0 auto}
.cta{display:block;width:100%;text-align:center;background:var(--c-primary);color:#fff;font-weight:700;font-size:16px;padding:15px;border-radius:var(--r-pill);margin-top:24px;text-decoration:none}
.note{text-align:center;font-size:12px;color:var(--c-stone);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">社会学<b>词汇</b></div>
    <div class="tag">sociologyvocab</div>
  </div>

  <section class="hero">
    <div class="eyebrow">背词像翻卡片一样简单</div>
    <div class="card" id="card">
      <div class="inner">
        <div class="face front">
          <div class="pos">NOUN · 名词</div>
          <div class="term">anomie</div>
          <div class="ph">/ˈanəmi/</div>
          <div class="hint">轻点卡片查看中文释义</div>
        </div>
        <div class="face back">
          <div class="pos">释义</div>
          <div class="def">失范：社会规范失效，个体失去行为准则而迷失的状态。</div>
          <div class="ex">涂尔干用 <b>anomie</b> 解释工业化城市中自杀率的上升。</div>
          <button class="flipbtn" onclick="document.getElementById('card').classList.toggle('flip')">↺ 翻回正面</button>
        </div>
      </div>
    </div>
    <h1 class="headline">正面英文，翻面释义</h1>
    <p class="sub">术语 + 音标在正面，中文释义和例句在背面。记不住就点"还没记住"，它会按遗忘曲线再找你。</p>
    <a class="cta" href="#">扫码开始背词</a>
    <div class="note">免费 · 网页 / 安卓都能用 · 9699vocab.cn</div>
  </section>
</div>
<script>document.getElementById('card').addEventListener('click',function(){this.classList.toggle('flip')})</script>
</body>
</html>
