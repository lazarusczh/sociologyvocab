// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// 根项目的构建产物同样挪出 OneDrive（理由见 app/build.gradle 顶部注释）
layout.buildDirectory.set(file('C:/vocab-build/root'))

// **所有子项目**的构建产物一并挪出 OneDrive。
// 2026-09-17 实测：只挪 app/root 还不够 —— `cap sync` 时 Capacitor 自动生成的
// `capacitor-cordova-android-plugins` 子项目，其 build 目录仍在 OneDrive 内被占用，报
//   EBUSY: resource busy or locked, unlink .../mergeReleaseResources/values-my/values-my.xml
// 使 `update android` 直接失败、整条 ship 中断（表面看像"卡住"）。这里统一处理，
// 以后新增任何子项目（含 cap 生成物）都自动落在一处，不必再单独补配置。
subprojects {
    layout.buildDirectory.set(file("C:/vocab-build/${project.name}"))
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
